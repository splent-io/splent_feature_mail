[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_mail"
version = "1.4.0"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [

]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.11.0"

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
[tool.splent.contract]
description = "mail feature"

[tool.splent.contract.provides]
routes     = []
blueprints = []
models     = []
commands   = ["hello"]
hooks      = []
services   = []
signals    = []
translations = []
docker     = []

[tool.splent.contract.requires]
features = []
env_vars = ["MAIL_FROM", "MAIL_HOST", "MAIL_PASSWORD", "MAIL_PORT", "MAIL_USERNAME", "MAIL_USE_TLS"]
signals  = []

[tool.splent.contract.extensible]
services  = []
templates = []
models    = []
hooks     = []
routes    = false
