[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_mail"
version = "1.4.3"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [

]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.11.0"

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
# Preserved across refreshes: description, category, tags, env,
# requires.features_manual (dependencies invisible to static analysis)
# and provides.routes_manual (routes built from configuration at
# registration time, which have no literal path to find in source).
[tool.splent.contract]
description = "Transactional email delivery via SMTP (MailService for other features)"
archetype = "service"

[tool.splent.contract.provides]
routes     = []
blueprints = []
models     = []
commands   = ["hello"]
hooks      = []
services   = ["MailService"]
signals    = []
translations = []
docker     = []

[tool.splent.contract.requires]
features = []
features_optional = ["settings"]
env_vars = ["MAIL_FROM", "MAIL_HOST", "MAIL_PASSWORD", "MAIL_PORT", "MAIL_USERNAME", "MAIL_USE_TLS"]
signals  = []

[tool.splent.contract.extensible]
services  = ["MailService"]
templates = []
models    = []
hooks     = []
routes    = false

# ── Configuration ─────────────────────────────────────────────────────────
# Where mail goes. The defaults point at the mailhog container a dev product
# runs, so nothing leaves the machine until a product says otherwise.
[tool.splent.config]
MAIL_HOST = "localhost"
MAIL_PORT = 1025
MAIL_USE_TLS = "0"
MAIL_USERNAME = ""
# A credential, so the default is empty. The real value belongs in the
# product's .env, which is not committed.
MAIL_PASSWORD = ""
# The address a recipient sees and may reply to. A product that sends real
# mail sets this to one that exists.
MAIL_FROM = "no-reply@localhost"
